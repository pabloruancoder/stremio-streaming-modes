<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player</title>
<link rel="icon" href="/fontes/logo.svg">
<style>
  html, body { margin:0; height:100%; background:#000; color:#eee; font:14px "Segoe UI", system-ui, sans-serif; overflow:hidden; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; }
  .err { display:grid; place-items:center; height:100%; }
</style>
</head>
<body>
<script>
  // Player embutido cadastrado em "Minhas fontes": ?u=<endereço do player>&t=<título>
  const p = new URLSearchParams(location.search);
  const u = p.get('u') || '';
  if (p.get('t')) document.title = p.get('t');
  if (/^https?:\/\//i.test(u)) {
    const f = document.createElement('iframe');
    f.src = u;
    f.allow = 'autoplay; fullscreen; encrypted-media; picture-in-picture';
    f.allowFullscreen = true;
    f.referrerPolicy = 'origin';
    document.body.appendChild(f);
  } else {
    document.body.innerHTML = '<div class="err">Endereço do player inválido.</div>';
  }
</script>
</body>
</html>
